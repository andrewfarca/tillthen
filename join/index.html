<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#161616" />
<title>You’re invited to a capsule 🔒</title>
<!-- What iMessage, Instagram and Snapchat show when this link is sent: a real page (not the 404) so the preview card loads. -->
<meta property="og:type" content="website" />
<meta property="og:site_name" content="Till Then" />
<meta property="og:title" content="You’re invited to a capsule 🔒" />
<meta property="og:description" content="Everyone adds photos and videos. Nobody sees a thing until the day it opens." />
<meta property="og:image" content="https://tillthenapp.com/og-join.png" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta property="og:url" content="https://tillthenapp.com/join/" />
<meta name="twitter:card" content="summary_large_image" />
<link rel="icon" href="/icon-192.png" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<style>
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; background:#161616; color:#fff; font:17px/1.5 -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; display:grid; place-items:center; padding:24px; text-align:center; }
  .card { max-width:420px; }
  .avatar { width:96px; height:96px; border-radius:50%; margin:0 auto 22px; display:grid; place-items:center; background:#1E6B4E; font:800 40px/1 -apple-system, system-ui, sans-serif; text-transform:uppercase; }
  h1 { font:800 34px/1.1 -apple-system, 'SF Pro Display', system-ui, sans-serif; letter-spacing:-.04em; margin:0 0 10px; }
  p { color:rgba(255,255,255,.68); margin:0 0 28px; }
  a.btn { display:block; background:#2FBF84; color:#0b1f17; font-weight:700; text-decoration:none; border-radius:999px; padding:15px 22px; margin:10px 0; }
  a.btn.alt { background:rgba(255,255,255,.1); color:#fff; }
  a.quiet { display:block; color:rgba(255,255,255,.68); margin-top:18px; }
  .mark { margin-top:42px; font:800 20px/1 -apple-system, system-ui, sans-serif; letter-spacing:-.04em; display:inline-flex; gap:8px; align-items:center; }
</style>
</head>
<body>
<div class="card" id="card">
  <h1>You’re invited to a capsule 🔒</h1>
  <p>Everyone adds photos and videos. Nobody sees a thing until the day it opens.</p>
  <a class="btn alt" href="https://testflight.apple.com/join/rRTBvHkE">Get Till Then</a>
  <a class="quiet" href="/">What is Till Then?</a>
</div>
<script>
  // The invite code rides after the # so it never reaches the web host: /join/#<code>
  const token = decodeURIComponent((location.hash || '').replace(/^#/, '')) || new URLSearchParams(location.search).get('c') || '';
  if (/^[A-Za-z0-9_-]{8,64}$/.test(token)) {
    document.getElementById('card').innerHTML = `
      <div class="avatar" style="background:#2FBF84;color:#0b1f17"><svg width="40" height="54" viewBox="0 -13 75 103" aria-hidden="true"><path d="M15 38 V16 a22.5 22.5 0 0 1 45 0 V22" fill="none" stroke="#0b1f17" stroke-width="11" stroke-linecap="round"/><rect x="2" y="34" width="71" height="54" rx="15" fill="#0b1f17"/></svg></div>
      <h1>You’re invited to a capsule</h1>
      <p>Everyone adds photos and videos. Nobody sees a thing until the day it opens.</p>
      <a class="btn" href="tillthen://join/${encodeURIComponent(token)}">Open in Till Then</a>
      <a class="btn alt" id="get" href="https://testflight.apple.com/join/rRTBvHkE">Don’t have it? Get the beta</a>
      <p style="font-size:14px;margin-top:18px">New here? We’ll copy your invite. Install the app, then tap <b>Got an invite link? Paste it</b> on the first screen.</p>
      <div class="mark">Till Then <svg width="16" height="22" viewBox="0 -13 75 103" aria-hidden="true"><path d="M15 38 V16 a22.5 22.5 0 0 1 45 0 V22" fill="none" stroke="#2FBF84" stroke-width="11" stroke-linecap="round"/><rect x="2" y="34" width="71" height="54" rx="15" fill="#2FBF84"/></svg></div>`;
    // Copy the invite on the way to TestFlight, so the app can pick it up after installing.
    document.getElementById('get').addEventListener('click', () => {
      try { navigator.clipboard.writeText(location.href); } catch (e) { /* the page still works */ }
    });
  }
</script>
</body>
</html>
